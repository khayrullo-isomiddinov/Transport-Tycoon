# Builds the self-contained Windows release (bundled Java runtime).
# - Manual run (Actions tab -> "Release build" -> Run workflow): uploads the zip as a workflow artifact.
# - Pushing a tag like v0.1.0: also attaches the zip to a GitHub Release for that tag.
name: Release build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.1.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Build, test and package
        shell: bash
        run: mvn -B clean install -Prelease "-Drelease.version=${{ steps.version.outputs.value }}"

      - uses: actions/upload-artifact@v4
        with:
          name: MiniTransportTycoon-${{ steps.version.outputs.value }}-windows-x64
          path: desktop/target/MiniTransportTycoon-*-windows-x64.zip
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" desktop/target/MiniTransportTycoon-*-windows-x64.zip \
            --title "Mini Transport Tycoon $GITHUB_REF_NAME" \
            --notes-file docs/release/RELEASE_NOTES.md \
            || gh release upload "$GITHUB_REF_NAME" desktop/target/MiniTransportTycoon-*-windows-x64.zip --clobber
